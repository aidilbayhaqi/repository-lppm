name: osdj-local
x-local: &local
  build:
    context: .
    target: app
  image: osdj-local:1.4
  env_file: .env.docker
  init: true
  volumes:
    - local-documents:/var/www/html/storage/app/private
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [local]
services:
  app:
    <<: *local
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *local
    command: [php, artisan, queue:work, database, --sleep=2, --tries=3, --timeout=60]
    restart: unless-stopped
    stop_grace_period: 90s
  scheduler:
    <<: *local
    command: [php, artisan, schedule:work]
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: repository_local
      MYSQL_USER: repository
      MYSQL_PASSWORD: ${DB_PASSWORD:?Fill DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Fill MYSQL_ROOT_PASSWORD in .env.docker}
    volumes: [local-database:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [local]
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [local]
  mailpit:
    image: axllent/mailpit:v1.30
    ports: ["127.0.0.1:8025:8025"]
    networks: [local]
  clamav:
    image: clamav/clamav:1.4
    profiles: [scanner]
    volumes: [local-signatures:/var/lib/clamav]
    networks: [local]
  tests:
    profiles: [test]
    build:
      context: .
      target: testing
    command: [php, artisan, test, --compact]
    networks: [local]
volumes:
  local-database:
  local-documents:
  local-signatures:
networks:
  local:
    driver: bridge
