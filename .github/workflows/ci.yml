name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            database_name: ':memory:'
          - database: mysql
            database_name: repository_test
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: repository_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database_name }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@ec406be512d7077f68eed36e63f4d91bc006edc4 # 2.35.4
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, pdo_mysql, simplexml, zip
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Release safety policies and tooling regressions
        run: |
          node tools/release-safety.mjs --source .
          node --test tests/Tooling/*.test.mjs
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: php artisan test --compact
      - run: composer audit
      - run: npm audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify Docker context exclusions
        run: node tools/release-safety.mjs --source .
      - name: Build and run isolated tests
        run: |
          docker build --target testing -t osdj-tests .
          docker run --rm osdj-tests
      - name: Build production targets
        run: |
          docker build --target app -t osdj-app .
          docker build --target web -t osdj-web .
      # Generate SBOMs from the *same images* that passed the production build.
      # Pins verified against the official Anchore release tag v0.24.3.
      # Syft version is fixed; the action never uses a mutable upstream tag.
      - name: Generate application image SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: osdj-app:latest
          format: cyclonedx-json
          syft-version: v1.57.2
          output-file: osdj-app.cdx.json
          artifact-name: osdj-app-cyclonedx-sbom
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false
      - name: Validate application SBOM
        run: node tools/verify-sbom.mjs osdj-app.cdx.json
      - name: Generate Nginx image SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: osdj-web:latest
          format: cyclonedx-json
          syft-version: v1.57.2
          output-file: osdj-web.cdx.json
          artifact-name: osdj-web-cyclonedx-sbom
          upload-artifact: true
          upload-release-assets: false
          dependency-snapshot: false
      - name: Validate Nginx SBOM
        run: node tools/verify-sbom.mjs osdj-web.cdx.json

